<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelCraft - Cyberpunk Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #030014;
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Ultra Glassmorphic App Card */
    .app-card {
      background: rgba(15, 11, 36, 0.65);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 
                  0 0 50px rgba(139, 92, 246, 0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* User Profile Bar */
    .profile-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
    }

    .user-text h4 {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }

    .user-text p {
      font-size: 11px;
      color: #22d3ee;
      font-weight: 600;
    }

    .badge-pro {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
    }

    /* Neon Tabs */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.8), rgba(6, 182, 212, 0.8));
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
    }

    /* Cyber Upload Area */
    .file-upload-box {
      border: 2px dashed rgba(6, 182, 212, 0.4);
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
      background: rgba(6, 182, 212, 0.03);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-upload-box:hover {
      border-color: #22d3ee;
      background: rgba(6, 182, 212, 0.08);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
      transform: translateY(-2px);
    }

    .file-upload-box input { display: none; }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6));
    }

    /* Grid & Inputs */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group.full-width { grid-column: span 2; }

    label {
      font-size: 11px;
      color: #c084fc;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="number"] {
      background: rgba(15, 11, 36, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    input[type="number"]:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.25);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .checkbox-group input {
      accent-color: #06b6d4;
      width: 16px;
      height: 16px;
    }

    /* Glowing Action Button */
    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
      transition: all 0.3s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(124, 58, 237, 0.6);
    }

    /* Preview Output */
    .preview-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 16px;
      display: none;
      text-align: center;
    }

    .preview-card img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .badge-container {
      display: flex;
      justify-content: space-around;
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 14px;
    }

    .badge span:first-child {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .badge span:last-child {
      font-weight: 800;
      font-size: 15px;
    }

    .btn-download {
      display: block;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      text-decoration: none;
      border-radius: 14px;
      padding: 12px;
      font-weight: 800;
      font-size: 14px;
      margin-top: 12px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- User Profile Bar -->
    <div class="profile-bar">
      <div class="user-info">
        <div class="avatar">DEV</div>
        <div class="user-text">
          <h4>Developer Mode</h4>
          <p>Cyberpunk Edition</p>
        </div>
      </div>
      <span class="badge-pro">PRO UNLOCKED</span>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab(event)">Compress</button>
      <button class="tab-btn" onclick="switchTab(event)">Resize</button>
      <button class="tab-btn" onclick="switchTab(event)">Convert</button>
    </div>

    <!-- Main View -->
    <div>
      <div class="file-upload-box" onclick="document.getElementById('imageInput').click()">
        <div class="upload-icon">⚡</div>
        <p id="fileNameDisplay" style="font-size: 13px; font-weight: 700; color: #f8fafc;">इमेज यहाँ ड्रॉप या सेलेक्ट करें</p>
        <p style="font-size: 11px; color: #94a3b8; margin-top: 2px;">PNG, JPG, WEBP फॉर्मेट</p>
        <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect(event)">
      </div>

      <div class="input-grid" style="margin-top: 14px;">
        <div class="input-group">
          <label>Width (px)</label>
          <input type="number" id="imgWidth" placeholder="Width">
        </div>
        <div class="input-group">
          <label>Height (px)</label>
          <input type="number" id="imgHeight" placeholder="Height">
        </div>
        <div class="input-group full-width">
          <label>Target Size (Max KB)</label>
          <input type="number" id="targetKB" value="50">
        </div>
      </div>

      <div class="checkbox-group" style="margin: 12px 0;">
        <input type="checkbox" id="aspectRatio" checked>
        <label for="aspectRatio">Aspect Ratio Lock रखें</label>
      </div>

      <button class="btn-action" onclick="processImage()">Compress Image 🚀</button>

      <!-- Preview Section -->
      <div class="preview-card" id="previewBox">
        <img id="compressedImage" src="" alt="Compressed Output">
        
        <div class="badge-container">
          <div class="badge">
            <span>Before</span>
            <span id="originalSize" style="color: #f43f5e;">-</span>
          </div>
          <div class="badge">
            <span>After</span>
            <span id="newSize" style="color: #34d399;">-</span>
          </div>
        </div>

        <a id="downloadBtn" class="btn-download">Download Result ⚡</a>
      </div>
    </div>

  </div>

  <script>
    let originalImage = null;
    let originalFileSizeKB = 0;

    function switchTab(e) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      originalFileSizeKB = Math.round(file.size / 1024);
      document.getElementById('fileNameDisplay').innerText = file.name;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function (e) {
        originalImage = new Image();
        originalImage.src = e.target.result;
        originalImage.onload = function () {
          document.getElementById('imgWidth').value = originalImage.width;
          document.getElementById('imgHeight').value = originalImage.height;
        };
      };
    }

    document.getElementById('imgWidth').addEventListener('input', function () {
      if (originalImage && document.getElementById('aspectRatio').checked) {
        const ratio = originalImage.height / originalImage.width;
        document.getElementById('imgHeight').value = Math.round(this.value * ratio);
      }
    });

    function getExactCompressedDataUrl(canvas, targetKB) {
      let minQuality = 0.05;
      let maxQuality = 0.98;
      let bestDataUrl = canvas.toDataURL('image/jpeg', minQuality);
      
      for (let i = 0; i < 12; i++) {
        let midQuality = (minQuality + maxQuality) / 2;
        let dataUrl = canvas.toDataURL('image/jpeg', midQuality);
        let sizeKB = (dataUrl.length * 3 / 4) / 1024;

        if (sizeKB <= targetKB) {
          bestDataUrl = dataUrl;
          minQuality = midQuality;
        } else {
          maxQuality = midQuality;
        }
      }
      return bestDataUrl;
    }

    function processImage() {
      if (!originalImage) {
        alert("कृपया एक इमेज चुनें!");
        return;
      }

      const targetKB = parseFloat(document.getElementById('targetKB').value);
      let newWidth = parseInt(document.getElementById('imgWidth').value) || originalImage.width;
      let newHeight = parseInt(document.getElementById('imgHeight').value) || originalImage.height;

      if (!targetKB || targetKB <= 0) {
        alert("सही KB साइज़ डालें!");
        return;
      }

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      let scale = 1.0;
      let finalDataUrl = "";
      let finalSizeKB = 0;

      while (scale >= 0.4) {
        canvas.width = Math.round(newWidth * scale);
        canvas.height = Math.round(newHeight * scale);

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

        finalDataUrl = getExactCompressedDataUrl(canvas, targetKB);
        finalSizeKB = Math.round((finalDataUrl.length * 3 / 4) / 1024);

        if (finalSizeKB <= targetKB) break;
        scale -= 0.05;
      }

      document.getElementById('compressedImage').src = finalDataUrl;
      document.getElementById('originalSize').innerText = `${originalFileSizeKB} KB`;
      document.getElementById('newSize').innerText = `${finalSizeKB} KB`;
      
      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.href = finalDataUrl;
      downloadBtn.download = "pixelcraft-output.jpg";

      document.getElementById('previewBox').style.display = 'block';
    }
  </script>

</body>
</html>
